name: ManiSkill

on:
  pull_request:
    branches: [main, feat/ros2-arm-integration]
  push:
    branches: [main]

jobs:
  maniskill:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: learning/maniskill/requirements.in
      - name: Install CPU policy and simulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libvulkan1 mesa-vulkan-drivers
          echo "VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*json' -print -quit)" >> "$GITHUB_ENV"
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r learning/maniskill/requirements.in
      - name: Real task smoke and environment contract
        run: |
          python -m learning.maniskill.experiment smoke
          python -m pytest -v learning/maniskill/test tests/learning
      - name: PPO checkpoint and evaluation smoke
        run: |
          python -m learning.maniskill.experiment train --timesteps 1024 --num-envs 1 --episodes 2 --output learning/runs/ci
          python -m learning.maniskill.experiment evaluate --checkpoint learning/runs/ci/final.zip --episodes 2 --output learning/runs/ci/reloaded.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maniskill-smoke-results
          path: learning/runs/ci
