name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest
        run: python -m pytest

      # Smoke runs of the two scripts, headless (plots use the Agg backend,
      # no --render / --viewer, so no OpenGL is needed).
      - name: Smoke - simulate.py
        run: python mujoco/simulate.py --print-every 100000

      - name: Smoke - pd_control.py
        run: python mujoco/pd_control.py
