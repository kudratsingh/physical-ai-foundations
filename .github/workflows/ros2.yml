name: ROS 2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/planar-arm-fk, feat/ros2-arm-integration, feat/week3-maniskill, feat/week4-behavior-cloning, feat/stage1-pickcube, feat/pickcube-ppo-debug, feat/pickcube-normalization, feat/pickcube-holding-diagnostics, feat/pickcube-bc-initialized-ppo]

jobs:
  ros2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Jazzy image
        run: docker compose -f ros2_ws/compose.yaml build
      - name: Build package and test real ROS graph and bag replay
        run: |
          docker compose -f ros2_ws/compose.yaml run --rm ros2 bash -c '
            source /opt/ros/jazzy/setup.bash &&
            colcon build --symlink-install --packages-select stage0_basics &&
            source install/setup.bash &&
            python3 -m pytest -v src/stage0_basics/test
          '
